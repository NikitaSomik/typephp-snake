name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHP-CS-Fixer (PER-CS)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  build:
    name: Native binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      # TypePHP reuses a PHP Nano object only when it is newer than its source in
      # vendor/, so both directories are cached together (the cache keeps file
      # times). The key is exact: after a runtime update everything is rebuilt.
      - uses: actions/cache@v4
        with:
          path: |
            vendor
            build
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - name: Compile with TypePHP (--nano)
        run: php vendor/bin/tpc.php project.yml --nano -O2 --no-progress

      - name: Smoke test
        run: |
          file snake
          ./snake --help
          ./snake --bench=20

      - name: Native and interpreter play identical games
        run: make parity

      - uses: actions/upload-artifact@v4
        with:
          name: snake-${{ runner.os }}-${{ runner.arch }}
          path: snake
          if-no-files-found: error
