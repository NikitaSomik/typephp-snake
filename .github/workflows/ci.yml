name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: PHP-CS-Fixer (PER-CS)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  build:
    name: Native binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      # TypePHP reuses a PHP Nano object only when it is newer than its source in
      # vendor/, so both directories are cached together (the cache keeps file
      # times). The key is exact: after a runtime update everything is rebuilt.
      - uses: actions/cache@v4
        with:
          path: |
            vendor
            build
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      - name: Compile with TypePHP (--nano)
        run: php vendor/bin/tpc.php project.yml --nano -O2 --no-progress

      - name: Smoke test
        run: |
          file snake
          ./snake --help
          ./snake --bench=20
          ./snake --bench-fib=25

      - name: Native binary and interpreter play identical games
        run: bench/parity.sh typephp

      - name: Play in a pseudo-terminal (binary and interpreter)
        run: |
          python3 tests/tty/smoke.py ./snake
          python3 tests/tty/smoke.py php runtimes/php/run.php

      - name: Benchmark table (informational, numbers from a shared CI runner)
        run: RUNS=1 GAMES=50 FIB=27 bench/run.sh php php-jit typephp

      - uses: actions/upload-artifact@v4
        with:
          name: snake-${{ runner.os }}-${{ runner.arch }}
          path: snake
          if-no-files-found: error

  # Experimental runtimes: CI builds and checks them, but a failure here does not
  # block a pull request (continue-on-error). php and TypePHP above are the ones
  # that must stay green. php-rust (phpr) has no CI install yet and runs locally.
  elephc:
    name: elephc (experimental) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress

      # Pinned for reproducible numbers. elvm still asks the GitHub API for the
      # release, and unauthenticated calls from shared runners hit the rate limit,
      # so it gets the job's read-only token.
      - name: Install elephc
        env:
          ELVM_VERSION: "0.2.1"
          ELEPHC_VERSION: "0.27.6"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://get.elephc.dev | sh -s -- --no-modify-path
          echo "$HOME/.elvm/bin" >> "$GITHUB_PATH"
          "$HOME/.elvm/bin/elvm" install "$ELEPHC_VERSION"
          "$HOME/.elvm/bin/elvm" use "$ELEPHC_VERSION" --global
          "$HOME/.elvm/bin/elephc" --version

      - name: Compile with elephc
        run: make build-elephc

      - name: Benchmarks run
        run: |
          runtimes/elephc/snake --bench=20
          runtimes/elephc/snake --bench-fib=25

      - name: elephc and the interpreter play identical games
        run: bench/parity.sh elephc
